<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio: one calendar for every class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--ink:#111827;--muted:#6B7280;--line:#E7E9EE;--brand:#3345C9;--soft:#ECEEFC;
--red:#D64545;--orange:#E9822B;--yellow:#DDAF1A;--green:#3FA66B}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.mark{display:flex;gap:3px;align-items:flex-end;height:20px}
.mark i{width:5px;border-radius:2px}
nav{display:flex;gap:4px;flex:1}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer}
nav button[aria-current=page]{background:var(--soft);color:var(--brand)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who small{display:block;color:var(--muted);line-height:1.2}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
main{max-width:1080px;margin:0 auto;padding:36px 24px 70px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 32px;max-width:60ch}
.layout{display:grid;grid-template-columns:230px 1fr;gap:48px;align-items:start}
.side label.cls{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.side input{accent-color:var(--brand);width:16px;height:16px;margin-top:4px}
.side small{display:block;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:32px}
.wd{background:#fff;padding:10px 4px;text-align:center}
.wd b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.wd span{font-size:20px;font-weight:700}
.wd i{display:block;height:4px;width:60%;margin:6px auto 0;border-radius:2px;background:var(--line)}
.dayhead{font-weight:700;margin:26px 0 4px}
.task{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task input{width:18px;height:18px;accent-color:var(--brand)}
.grow{flex:1;min-width:0}
.tt{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.sev{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.empty{padding:36px 0;color:var(--muted)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head h2{margin:0;flex:1;font-size:18px}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{background:#fff;font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:8px 0}
.cell{min-height:84px;border:0;background:#fff;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.cell:hover:not(:disabled){background:var(--bg)}
.cell:disabled{cursor:default;color:#B6BCC6}
.cell.out .n{color:#B6BCC6}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.cell.full{background:#FDF1F1}
.n{font-weight:600;font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.today .n{background:var(--brand);color:#fff}
.dots{display:flex;gap:4px;align-items:center}
.cnt{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.day{border-left:1px solid var(--line);padding-left:32px}
label.f{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
select,input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 12px;border:1px solid #D5D9E0;border-radius:8px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;padding:11px 16px;border-radius:8px;cursor:pointer;width:100%;margin-top:18px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #D5D9E0;font-weight:600;margin-top:10px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.warn{color:#9B2C2C;font-size:14px;margin-top:12px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.note{font-size:12px;color:var(--muted);margin-top:28px}
.auth{max-width:380px;margin:6vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px}
.auth h1{font-size:24px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gwrap{display:flex;justify-content:center;min-height:44px}
.swap{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
@media(max-width:860px){.layout{grid-template-columns:1fr;gap:28px}.day{border:0;padding:0}.cell{min-height:58px}.who small{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,sendEmailVerification,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,query,where,onSnapshot,addDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== Setup =====
   1. Paste your Firebase web app config below (Firebase console > Project settings > Your apps).
   2. ALLOWED_DOMAIN: e.g. "imsa.edu" to accept only that school's accounts ("" = any).
   3. CAP: maximum tasks per day across all classes. */
const FIREBASE_CONFIG = { apiKey:'AIzaSyDzYjHKZnTJjNXzaDySKpCoJB1OwnInKFQ', authDomain:'folio-af0ce.firebaseapp.com', projectId:'folio-af0ce', appId:'1:819292250837:web:850fc1d924e6c2c3be785c' };
const CONFIG = { ALLOWED_DOMAIN:'', CAP:3 };

const CAP = CONFIG.CAP;
const configured = !!FIREBASE_CONFIG.apiKey;
let auth, db;
if (configured){ const app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); db = getFirestore(app); }

const SEV = {red:'Heavy',orange:'High',yellow:'Moderate',green:'Light'};
const COL = {red:'var(--red)',orange:'var(--orange)',yellow:'var(--yellow)',green:'var(--green)'};
const TYPES = ['Test','Assignment','Homework'];
const CLASSES = [
 {id:'calc',name:'Literary Explorations III: World',teacher:'Dr. Hancock'},
  {id:'chem',name:'Biology: Molecular and Cellular',teacher:'Dr. Amacher'},
  {id:'lit',name:'Mathematical Investigations II',teacher:'Dr. Krouse'},
  {id:'cs',name:'Foundations of Healthy Living',teacher:'Ms. Myers and Mr. Lundgren'},
  {id:'hist',name:'Spanish III',teacher:'Profe Kaluza'}
];
const cname = id => CLASSES.find(c => c.id === id) || {id,name:id,teacher:''};
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY = iso(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (s,o) => parse(s).toLocaleDateString('en-US',o);
const $ = id => document.getElementById(id);
const initials = n => (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const MSG = {'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'An account with that email already exists. Sign in instead.','auth/weak-password':'Use a password with at least 6 characters.','auth/popup-closed-by-user':'The sign-in window was closed. Try again.','auth/too-many-requests':'Too many attempts. Wait a minute and try again.','auth/unauthorized-domain':'Add this site’s address under Authorized domains in Firebase Authentication settings.','permission-denied':'You don’t have permission to do that.'};
const friendly = e => MSG[e.code] || ('Something went wrong: ' + (e.message || e));

const S = {ready:false,user:null,profile:null,teacher:null,tasks:[],view:'dash',authTab:'in',flash:'',signupName:'',msg:'',
  month:new Date(new Date().getFullYear(), new Date().getMonth(), 1), sel:TODAY};
const byDate = d => S.tasks.filter(t => t.date === d);
const heaviest = ts => ['red','orange','yellow','green'].find(s => ts.some(t => t.sev === s));
const setErr = (m,ok) => { const e = $('err'); if (e){ e.textContent = m; e.style.color = ok ? 'var(--green)' : ''; } };
const logoMark = () => `<span class="mark" aria-hidden="true"><i style="height:9px;background:var(--green)"></i><i style="height:14px;background:var(--yellow)"></i><i style="height:20px;background:var(--orange)"></i><i style="height:12px;background:var(--red)"></i></span>`;
function relLabel(d){
  if (d === TODAY) return 'Today';
  if (d === iso(addDays(new Date(),1))) return 'Tomorrow';
  return fmt(d,{weekday:'long',month:'short',day:'numeric'});
}

/* ===== Views ===== */
const setupView = () => `<div class="auth"><h1>Connect Firebase</h1><p class="sub" style="margin:0">Paste your Firebase config into <b>FIREBASE_CONFIG</b> at the top of the script to turn on accounts and the shared calendar.</p></div>`;
function authView(){
  const up = S.authTab === 'up', f = S.flash; S.flash = '';
  return `<div class="auth"><div class="logo" style="margin-bottom:22px">${logoMark()}Folio</div>
  <h1>${up?'Create your account':'Sign in'}</h1>
  <p class="sub" style="margin-bottom:22px">${up?'Teachers post work. Students see it all in one place.':'See what’s due across every class.'}</p>
  <button class="btn alt" id="gbtn" type="button" style="margin:0">Continue with Google</button>
  <div class="or">or use email</div>
  <form id="authForm">
    ${up?`<label class="f" for="nm">Full name</label><input type="text" id="nm" autocomplete="name" required>`:''}
    <label class="f" for="em">School email</label><input type="email" id="em" autocomplete="email" required>
    <label class="f" for="pw">Password</label><input type="password" id="pw" autocomplete="${up?'new-password':'current-password'}" minlength="6" required>
    <div class="warn" id="err" role="alert">${esc(f)}</div>
    <button class="btn" type="submit">${up?'Create account':'Sign in'}</button>
  </form>
  <div class="swap">${up?'Already have an account?':'New here?'} <button class="link" id="swap">${up?'Sign in':'Create an account'}</button></div></div>`;
}
const verifyView = () => `<div class="auth"><h1>Verify your email</h1><p class="sub">We sent a link to <b>${esc(S.user.email)}</b>. Open it, then come back and continue.</p>
  <div class="warn" id="err" role="alert"></div><button class="btn" id="vdone">I’ve verified</button><button class="btn alt" id="vresend">Resend email</button><button class="btn alt" id="vout">Sign out</button></div>`;

function taskRow(t, o={}){
  const c = cname(t.cls), isDone = !!S.profile.done[t.id];
  return `<div class="task ${isDone&&!o.plain?'done':''}">
    ${o.plain ? '' : `<input type="checkbox" data-done="${t.id}" ${isDone?'checked':''} aria-label="Mark ${esc(t.title)} done">`}
    <div class="grow"><div class="tt">${esc(t.title)}</div><div class="meta">${esc(c.name)} · ${esc(t.type)}${o.plain&&c.teacher?' · '+esc(c.teacher):''}</div></div>
    <span class="sev"><i class="dot" style="--c:${COL[t.sev]||'var(--line)'}"></i>${SEV[t.sev]||''}</span>
    ${o.del ? `<button class="x" data-del="${t.id}" aria-label="Delete ${esc(t.title)}">\u00d7</button>` : ''}</div>`;
}
function dashView(){
  const fl = S.profile.filter;
  const days = Array.from({length:7},(_,i)=>iso(addDays(new Date(),i)));
  const strip = days.map(d => { const ts = byDate(d).filter(t=>fl.includes(t.cls)), h = heaviest(ts);
    return `<div class="wd"><b>${fmt(d,{weekday:'short'})}</b><span>${ts.length}</span><i style="background:${h?COL[h]:'var(--line)'}"></i></div>`; }).join('');
  const list = S.tasks.filter(t=>fl.includes(t.cls)).sort((a,b)=>a.date.localeCompare(b.date));
  const g = {}; list.forEach(t => (g[t.date] = g[t.date] || []).push(t));
  const body = Object.keys(g).length ? Object.keys(g).map(d=>`<div class="dayhead">${relLabel(d)}</div>${g[d].map(t=>taskRow(t)).join('')}`).join('')
    : `<div class="empty">Nothing due for the classes you picked. Select more classes on the left, or check back once your teachers post work.</div>`;
  return `<h1>What’s due</h1><p class="sub">Choose your classes once. This list shows everything your teachers have posted.</p>
  <div class="layout"><aside class="side"><h2>My classes</h2>
    ${CLASSES.map(c=>`<label class="cls"><input type="checkbox" data-cls="${c.id}" ${fl.includes(c.id)?'checked':''}><span>${c.name}<small>${c.teacher}</small></span></label>`).join('')}
  </aside><section><h2>Next 7 days</h2><div class="week">${strip}</div>${body}</section></div>`;
}
function calView(){
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const start = addDays(new Date(y,m,1), -new Date(y,m,1).getDay());
  let cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = addDays(start,i), k = iso(d), ts = byDate(k);
    cells += `<button class="cell ${d.getMonth()!==m?'out':''} ${k===S.sel?'sel':''} ${k===TODAY?'today':''} ${ts.length>=CAP?'full':''}" data-day="${k}" ${k<TODAY?'disabled':''} aria-label="${fmt(k,{weekday:'long',month:'long',day:'numeric'})}, ${ts.length} of ${CAP} tasks">
      <span class="n">${d.getDate()}</span><span class="dots">${ts.map(t=>`<i class="dot" style="--c:${COL[t.sev]||'var(--line)'}"></i>`).join('')}${ts.length?`<span class="cnt">${ts.length}/${CAP}</span>`:''}</span></button>`;
  }
  const ts = byDate(S.sel), full = ts.length >= CAP; let next = '';
  if (full) for (let i=1;i<60;i++){ const k = iso(addDays(parse(S.sel),i)); if (byDate(k).length < CAP){ next = k; break; } }
  const c = cname(S.teacher.cls);
  return `<h1>Calendar</h1><p class="sub">Each day holds up to ${CAP} items across all classes, so students are never hit with everything at once.</p>
  <div class="layout" style="grid-template-columns:1fr 320px;gap:40px"><section>
    <div class="cal-head"><button class="ib" data-nav="-1" aria-label="Previous month">\u2039</button><h2>${S.month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><button class="ib" data-nav="1" aria-label="Next month">\u203a</button></div>
    <div class="grid">${cells}</div>
    <div class="legend">${Object.keys(SEV).map(s=>`<span><i class="dot" style="--c:${COL[s]}"></i>${SEV[s]}</span>`).join('')}<span>Shaded day = full</span></div>
  </section><aside class="day">
    <h2>${fmt(S.sel,{weekday:'long',month:'long',day:'numeric'})}</h2><div class="meta">${ts.length} of ${CAP} slots used</div>
    ${ts.length ? ts.map(t=>taskRow(t,{plain:true,del:t.owner===S.user.uid})).join('') : '<div class="empty" style="padding:16px 0">No work posted yet.</div>'}
    <label class="f" for="ttl">Add for ${esc(c.name)}</label><input type="text" id="ttl" maxlength="60" placeholder="e.g. Chapter 5 quiz">
    <div class="row"><div><label class="f" for="typ">Type</label><select id="typ">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div><label class="f" for="sev">Severity</label><select id="sev">${Object.keys(SEV).map(s=>`<option value="${s}">${SEV[s]}</option>`).join('')}</select></div></div>
    ${full?`<div class="warn">This day is full. ${next?`<button class="link" data-jump="${next}">Try ${fmt(next,{weekday:'short',month:'short',day:'numeric'})}</button>, which has room.`:''}</div>`:''}
    ${S.msg?`<div class="warn">${esc(S.msg)}</div>`:''}
    <button class="btn" id="add" ${full?'disabled':''}>Add to calendar</button>
  </aside></div>`;
}

function render(){
  const root = $('root');
  if (!configured){ root.innerHTML = setupView(); return; }
  if (!S.ready || (S.user && S.user.emailVerified && !S.profile)){ root.innerHTML = '<div class="auth"><p class="sub" style="margin:0">Loading…</p></div>'; return; }
  if (!S.user){
    root.innerHTML = authView();
    $('authForm').onsubmit = onAuthSubmit; $('gbtn').onclick = googleSignIn;
    $('swap').onclick = () => { S.authTab = S.authTab==='in'?'up':'in'; render(); };
    return;
  }
  if (!S.user.emailVerified){
    root.innerHTML = verifyView();
    $('vout').onclick = () => signOut(auth);
    $('vresend').onclick = () => sendEmailVerification(S.user).then(()=>setErr('Sent. Check your inbox.',true)).catch(e=>setErr(friendly(e)));
    $('vdone').onclick = async () => {
      await auth.currentUser.reload(); await auth.currentUser.getIdToken(true);
      if (!auth.currentUser.emailVerified) return setErr('Not verified yet. Open the link in the email first.');
      S.user = auth.currentUser; S.profile = null; render(); startSession(S.user);
    };
    return;
  }
  const keep = ['ttl','typ','sev'].map(id => $(id) ? $(id).value : null);
  const teacher = !!S.teacher; if (!teacher) S.view = 'dash';
  const p = S.profile;
  root.innerHTML = `<header><div class="bar"><div class="logo">${logoMark()}Folio</div>
    <nav>${teacher?`<button data-view="cal" aria-current="${S.view==='cal'?'page':'false'}">Calendar</button>`:''}<button data-view="dash" aria-current="${S.view==='dash'?'page':'false'}">${teacher?'Student view':'What’s due'}</button></nav>
    <div class="who"><div><b>${esc(p.name)}</b><small>${teacher?'Teacher · '+esc(cname(S.teacher.cls).name):'Student'}</small></div>
    <div class="av">${p.photo?`<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer">`:esc(initials(p.name))}</div>
    <button class="link" id="out">Sign out</button></div></div></header>
    <main>${S.view==='cal' && teacher ? calView() : dashView()}</main>`;
  $('out').onclick = () => signOut(auth);
  ['ttl','typ','sev'].forEach((id,i) => { if ($(id) && keep[i] !== null) $(id).value = keep[i]; });
}

/* ===== Auth + data ===== */
async function onAuthSubmit(e){
  e.preventDefault();
  const email = $('em').value.trim(), pw = $('pw').value;
  if (CONFIG.ALLOWED_DOMAIN && !email.toLowerCase().endsWith('@'+CONFIG.ALLOWED_DOMAIN)) return setErr('Use your school email (@'+CONFIG.ALLOWED_DOMAIN+').');
  try{
    if (S.authTab === 'up'){
      S.signupName = $('nm').value.trim();
      const c = await createUserWithEmailAndPassword(auth,email,pw);
      await updateProfile(c.user,{displayName:S.signupName}); await sendEmailVerification(c.user);
    } else await signInWithEmailAndPassword(auth,email,pw);
  }catch(err){ setErr(friendly(err)); }
}
async function googleSignIn(){
  const p = new GoogleAuthProvider();
  if (CONFIG.ALLOWED_DOMAIN) p.setCustomParameters({hd:CONFIG.ALLOWED_DOMAIN});
  try{ await signInWithPopup(auth,p); }catch(err){ setErr(friendly(err)); }
}
let unsub = null;
async function startSession(user){
  try{
    const email = user.email.toLowerCase();
    if (CONFIG.ALLOWED_DOMAIN && !email.endsWith('@'+CONFIG.ALLOWED_DOMAIN)){ S.flash = 'Use your school account (@'+CONFIG.ALLOWED_DOMAIN+').'; return signOut(auth); }
    const uref = doc(db,'users',user.uid); let snap = await getDoc(uref);
    if (!snap.exists()){
      await setDoc(uref,{name:S.signupName||user.displayName||email.split('@')[0],email,photo:user.photoURL||'',filter:CLASSES.map(c=>c.id),done:{}});
      snap = await getDoc(uref);
    }
    const p = snap.data(); p.filter = p.filter || CLASSES.map(c=>c.id); p.done = p.done || {};
    S.profile = p;
    const t = await getDoc(doc(db,'teachers',email));
    S.teacher = t.exists() ? t.data() : null;
    S.view = S.teacher ? 'cal' : 'dash';
    if (unsub) unsub();
    unsub = onSnapshot(query(collection(db,'tasks'),where('date','>=',TODAY)),
      s => { S.tasks = s.docs.map(d => ({id:d.id,...d.data()})); render(); },
      e => { S.msg = friendly(e); render(); });
    render();
  }catch(err){ S.flash = friendly(err); signOut(auth); }
}
if (configured) onAuthStateChanged(auth, user => {
  S.ready = true; S.user = user; S.profile = null; S.teacher = null;
  if (!user){ if (unsub){ unsub(); unsub = null; } S.tasks = []; return render(); }
  render(); if (user.emailVerified) startSession(user);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-view],[data-day],[data-nav],[data-del],[data-jump],#add');
  if (!b || !S.profile) return;
  if (b.dataset.view) S.view = b.dataset.view;
  else if (b.dataset.day){ S.sel = b.dataset.day; S.msg=''; }
  else if (b.dataset.nav) S.month = new Date(S.month.getFullYear(), S.month.getMonth()+Number(b.dataset.nav), 1);
  else if (b.dataset.jump){ S.sel = b.dataset.jump; const d = parse(S.sel); S.month = new Date(d.getFullYear(), d.getMonth(), 1); S.msg=''; }
  else if (b.dataset.del){ deleteDoc(doc(db,'tasks',b.dataset.del)).catch(err => { S.msg = friendly(err); render(); }); return; }
  else if (b.id === 'add'){
    const title = $('ttl').value.trim();
    if (!title){ S.msg = 'Add a title before saving.'; return render(); }
    if (byDate(S.sel).length >= CAP){ S.msg = 'That day is full.'; return render(); }
    const task = {date:S.sel,cls:S.teacher.cls,title,type:$('typ').value,sev:$('sev').value,owner:S.user.uid};
    $('ttl').value = ''; S.msg = '';
    addDoc(collection(db,'tasks'),task).catch(err => { S.msg = friendly(err); render(); });
    return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target; if (!S.profile) return;
  const uref = doc(db,'users',S.user.uid);
  if (t.dataset.done){ S.profile.done[t.dataset.done] = t.checked; setDoc(uref,{done:{[t.dataset.done]:t.checked}},{merge:true}); render(); }
  else if (t.dataset.cls){ const f = S.profile.filter, i = f.indexOf(t.dataset.cls); i>-1 ? f.splice(i,1) : f.push(t.dataset.cls); setDoc(uref,{filter:f},{merge:true}); render(); }
});
render();
</script>
</body>
</html>
